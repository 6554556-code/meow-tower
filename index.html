<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Мяу Башня</title>
  <!-- Пиксельный шрифт с кириллицей -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Telegram Mini App: даёт игре знать, кто играет. Вне Telegram ничего не делает -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ: валюты -->
    <header class="topbar">
      <!-- Шестерёнка: настройки и «Начать заново» -->
      <button class="gear" id="btn-settings" aria-label="Настройки">⚙️</button>
      <!-- Рейтинг башни: тап — почему такой -->
      <button class="pill rating-pill" id="btn-rating">⭐ <span id="rating-num">3,0</span></button>
      <!-- Мур-чат: число — новые сообщения -->
      <button class="chat-btn" id="btn-chat" aria-label="Мур-чат">💬<span class="unread" id="chat-unread" hidden></span></button>
      <!-- Событие: значок с таймером, тап — подробности -->
      <button class="event-btn" id="btn-event" hidden></button>
      <div class="pill">
        <img src="assets/ui/coin.png" alt="Монеты" data-i18n-alt="alt.coins">
        <span id="coins">0</span>
      </div>
      <div class="pill">
        <img src="assets/ui/fish.png" alt="Рыбки" data-i18n-alt="alt.fish">
        <span id="fish">0</span>
      </div>
    </header>

    <!-- СЦЕНА: здание на фоне города (фон задан в style.css) -->
    <main class="scene">
      <div class="building">
        <!-- Верхний ряд: шестерёнка лифта и вывеска -->
        <img class="lift-top" src="assets/ui/lift_top.png" alt="">
        <img class="sign" id="sign" src="assets/bg/sign.png" alt="Мяу Башня" data-i18n-alt="sign.alt">

        <!-- Шахта лифта: номера этажей и кабинку расставляет view.js -->
        <div class="shaft" id="shaft">
          <!-- Робот-лифтёр работает: значок с таймером -->
          <div class="robot-badge" id="robot-badge" hidden></div>
          <!-- Кабинка: тап — посадить гостя из лобби -->
          <div class="lift-cab" id="lift-cab">
            <img src="assets/ui/lift_cab.png" alt="Лифт" data-i18n-alt="alt.lift">
            <div class="cab-rider" id="cab-rider"></div>
          </div>
        </div>

        <!-- Башня: этажи рисует view.js по «памяти» игры -->
        <div class="tower" id="tower"></div>
      </div>
    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ: кнопка стройки -->
    <footer class="bottombar">
      <button class="btn-up" id="btn-upgrades" aria-label="Улучшения"><img src="assets/ui/hammer.png" alt=""></button>
      <button class="btn-build" id="btn-build">
        <span class="btn-title" data-i18n="build.build">ПОСТРОИТЬ ЭТАЖ</span>
        <span class="btn-price"></span>
      </button>
    </footer>

    <!-- СТРЕЛКА К ЛИФТУ: видна, когда кабинка за краем экрана -->
    <button class="to-lift" id="to-lift" hidden aria-label="К лифту"><img src="assets/ui/arrow_down.png" alt=""></button>

    <!-- ОБУЧЕНИЕ: подсказка от кота-консьержа -->
    <div class="tut" id="tut" hidden>
      <div class="avatar mini tut-cat" style="background-image:url(assets/cats/cat_concierge.png)"></div>
      <div class="tut-main">
        <div class="tut-text"></div>
        <div class="tut-btns">
          <span class="tut-count"></span>
          <button class="tut-skip" data-i18n="tut.skip">Пропустить</button>
          <button class="btn-ok tut-next" hidden>Понятно</button>
        </div>
      </div>
    </div>

    <!-- ОКОШКО ВЫБОРА ТИПА ЭТАЖА (появляется, когда стройка закончилась) -->
    <div class="modal" id="chooser" hidden onclick="if (event.target === this) hideChooser()">
      <div class="modal-box">
        <button class="modal-close" onclick="hideChooser()">✕</button>
        <div class="modal-title" data-i18n="chooser.title">КАКИМ БУДЕТ ЭТАЖ?</div>
        <div class="modal-sub" data-i18n="chooser.sub">Можно закрыть и подумать — этаж подождёт</div>
        <div class="modal-grid" id="chooser-grid"></div>
      </div>
    </div>

    <!-- ОКОШКО ЖИЛЬЦОВ (тап по комнате сна) -->
    <div class="modal" id="residents" hidden onclick="if (event.target === this) closeResidents()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeResidents()">✕</button>
        <div id="residents-body"></div>
      </div>
    </div>

    <!-- КАРТОЧКА ЭТАЖА (тап по магазину или люксу): товары, склад, поставки / VIP и аренда -->
    <div class="modal" id="shop" hidden onclick="if (event.target === this) closeShop()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeShop()">✕</button>
        <div id="shop-body"></div>
      </div>
    </div>

    <!-- ОКОШКО УЛУЧШЕНИЙ (кнопка ⬆️ внизу) -->
    <div class="modal" id="upgrades" hidden onclick="if (event.target === this) closeUpgrades()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeUpgrades()">✕</button>
        <div id="upgrades-body"></div>
      </div>
    </div>

    <!-- РЕЙТИНГ: из чего складывается -->
    <div class="modal" id="rating" hidden onclick="if (event.target === this) closeModal('rating')">
      <div class="modal-box">
        <button class="modal-close" onclick="closeModal('rating')">✕</button>
        <div id="rating-body"></div>
      </div>
    </div>

    <!-- СОБЫТИЕ -->
    <div class="modal" id="event" hidden onclick="if (event.target === this) closeEvent()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeEvent()">✕</button>
        <div id="event-body"></div>
      </div>
    </div>

    <!-- МУР-ЧАТ -->
    <div class="modal" id="chat" hidden onclick="if (event.target === this) closeChat()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeChat()">✕</button>
        <div id="chat-body"></div>
      </div>
    </div>

    <!-- ОКОШКО «С ВОЗВРАЩЕНИЕМ!» -->
    <div class="modal" id="welcome" hidden onclick="if (event.target === this) closeModal('welcome')">
      <div class="modal-box"><div id="welcome-body"></div></div>
    </div>

    <!-- ПОДАРОК ДНЯ (без крестика: забираешь кнопкой) -->
    <div class="modal" id="daily" hidden>
      <div class="modal-box"><div id="daily-body"></div></div>
    </div>

    <!-- ОКОШКО НАСТРОЕК -->
    <div class="modal" id="settings" hidden onclick="if (event.target === this) closeModal('settings')">
      <div class="modal-box">
        <button class="modal-close" onclick="closeModal('settings')">✕</button>
        <div id="settings-body"></div>
      </div>
    </div>

  </div>

  <!-- СКРИПТЫ: порядок важен — пульт и имена, потом картинка, потом правила -->
  <script src="js/config.js"></script>
  <script src="js/names.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/view.js"></script>
  <script src="js/social.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/music.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/events.js"></script>
  <script src="js/save.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
